[package]
name = "philharmonic-workflow"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/philharmonic-workflow"
description = "Workflow orchestration layer for Philharmonic: WorkflowTemplate, WorkflowInstance, StepRecord entity kinds, the engine, and the StepExecutor / ConfigLowerer traits."

[dependencies]
philharmonic-types = "0.3"
philharmonic-store = "0.1"
philharmonic-policy = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false, features = [] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
dockerlet = "0.1"
philharmonic-store-sqlx-mysql = "0.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true
